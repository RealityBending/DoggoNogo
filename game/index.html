<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Doggo/Nogo: The Game</title>
        <style>
            :root {
                --target-width: 1792;
                --target-height: 1024;
            }
            body {
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background-color: #f0f0f0;
            }
            #canvasWrapper {
                position: relative;
            }
            canvas {
                border: 1px solid black;
                background-color: #000;
                display: block;
                width: 100%; /* CSS size; actual drawing buffer set in JS */
                height: auto;
                aspect-ratio: calc(var(--target-width) / var(--target-height));
            }
        </style>
    </head>
    <body>
        <div id="canvasWrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- STANDALONE VERSION OF THE GAME -->

        <script type="module">
            // Entry point for the standalone game: size the canvas, then run levels 1 -> 2 -> 3
            // (or start partway through the chain -- see LEVELS / START_LEVEL below).
            import { DoggoNogoCore } from "./game.js"
            import { DoggoNogoEngine } from "./engine.js"
            import { level1 } from "./levels/level1.js"
            import { level2 } from "./levels/level2.js"
            import { level3 } from "./levels/level3.js"
            import { level1IntroSequence, level2IntroSequence } from "./levels/intro.js"

            const TARGET_W = 1792
            const TARGET_H = 1024
            const ASPECT = TARGET_W / TARGET_H
            const canvas = document.getElementById("gameCanvas")

            function sizeCanvas() {
                // `innerWidth`/`innerHeight` include the scrollbar, and the canvas carries a 1px
                // border on each side, so sizing off them leaves the page a couple of pixels
                // scrollable -- enough for an arrow key to slide the whole canvas and look like the
                // camera jolting. Measure the real client area and leave room for the border.
                const BORDER = 2
                const maxW = document.documentElement.clientWidth - BORDER
                const maxH = document.documentElement.clientHeight - BORDER
                // Constrain by width first
                let w = Math.min(TARGET_W, maxW)
                let h = Math.round(w / ASPECT)
                if (h > maxH) {
                    h = Math.min(TARGET_H, maxH)
                    w = Math.round(h * ASPECT)
                }
                // Set drawing buffer (for crisp rendering)
                const dpr = window.devicePixelRatio || 1
                canvas.width = Math.round(w * dpr)
                canvas.height = Math.round(h * dpr)
                // Set CSS size
                canvas.style.width = w + "px"
                canvas.style.height = h + "px"
                const ctx = canvas.getContext("2d")
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
            }

            sizeCanvas()
            window.addEventListener("resize", () => {
                sizeCanvas()
                // Let current running level recompute sprite sizes/positions (engine also listens, but call directly for immediate effect)
                if (DoggoNogoEngine.level && typeof DoggoNogoEngine.level.handleResize === "function") {
                    DoggoNogoEngine.level.handleResize()
                }
            })

            // Levels are run in order. To test a level without playing through the earlier ones,
            // load the page with `?level=2` / `?level=3`, or change START_LEVEL below (opening the
            // page with no `level` param writes START_LEVEL into the URL). The chosen level shows
            // the cover screen and later ones follow it as usual.
            const LEVELS = [
                { level: level1, introSequence: level1IntroSequence },
                { level: level2, introSequence: level2IntroSequence },
                { level: level3, introSequence: null },
            ]
            // TEMPORARY (testing Level 3): set back to 1 to play the game from the start.
            const START_LEVEL = 3 // 1-based; overridden by ?level=N

            function resolveStartIndex() {
                const params = new URLSearchParams(window.location.search)
                const fromUrl = params.get("level")
                const requested = parseInt(fromUrl === null ? START_LEVEL : fromUrl, 10)
                if (!Number.isFinite(requested) || requested < 1 || requested > LEVELS.length) {
                    console.warn(`Unknown start level "${fromUrl}"; starting at level 1.`)
                    return 0
                }
                if (fromUrl === null) {
                    // Show the level actually being run in the address bar, so a reload or a copied
                    // link keeps it and it is obvious the game is not starting from the beginning.
                    params.set("level", requested)
                    window.history.replaceState(null, "", `${window.location.pathname}?${params}`)
                }
                return requested - 1
            }

            const startIndex = resolveStartIndex()

            function runLevel(index) {
                const { level, introSequence } = LEVELS[index]
                const isLast = index === LEVELS.length - 1
                DoggoNogoEngine.run(canvas, level, {
                    assetBasePath: "assets/",
                    introSequence,
                    // The cover belongs to the first level actually shown; chained ones go straight
                    // to their instruction screen.
                    skipCover: index !== startIndex,
                    // Only the levels still to come are worth preloading.
                    otherLevels: LEVELS.slice(index + 1).map((entry) => entry.level),
                    continueHint: isLast ? "Press SPACE to finish" : "Press SPACE to continue",
                    onFinish: (state) => {
                        if (isLast) {
                            console.log(`All levels finished. Final state level${index + 1}:`, state)
                            return
                        }
                        const proceed = (e) => {
                            if (e.code === "Space") {
                                document.removeEventListener("keydown", proceed)
                                runLevel(index + 1)
                            }
                        }
                        document.addEventListener("keydown", proceed)
                    },
                })
            }

            ;(async () => {
                if (!canvas) {
                    console.error(`Could not start level ${startIndex + 1}: canvas not found.`)
                    return
                }
                // The engine performs global + level preload internally; just call run after a slight defer for paint.
                DoggoNogoCore.renderLoadingScreen(canvas, "Loading the game...")
                setTimeout(() => runLevel(startIndex), 150)
            })()
        </script>
    </body>
</html>
