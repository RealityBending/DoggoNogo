<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Doggo/Nogo: The Game</title>
        <style>
            :root {
                --target-width: 1920;
                --target-height: 1080;
            }
            html,
            body {
                /* Every touch gesture the browser would otherwise claim is claimed here instead:
                   a scroll, a pull-to-refresh, a double-tap zoom or a long-press callout landing
                   mid-trial is at best a distraction and at worst a lost response. Taps reach the
                   game through game/input.js, which is the only thing that should read them. */
                touch-action: none;
                overscroll-behavior: none;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            body {
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                /* Mobile browser chrome is counted by `vh` but not actually available, so `100vh`
                   overflows by the height of the address bar and leaves the stage scrollable.
                   `dvh` is the measurement that tracks the chrome; the `vh` line above stays as
                   the fallback for anything that does not know it. */
                min-height: 100dvh;
                /* Dark stage so the canvas reads like a theatre screen, not a form element */
                background: radial-gradient(ellipse at 50% 35%, #182036 0%, #0c101d 55%, #070a12 100%);
            }

            /* Rotate prompt. The stage is a fixed 16:9 for the sake of the measurements, so in
               portrait it collapses to a strip across the middle of a phone. Android is pinned to
               landscape once fullscreen is granted (`_lockLandscape` in game/engine.js); iPhone
               Safari supports neither the Fullscreen API nor an orientation lock, so on those
               devices this prompt is the whole mechanism rather than a fallback. */
            #rotate {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 10;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 22px;
                padding: 24px;
                text-align: center;
                background: #070a12;
                color: #f4f6fb;
                font: 400 20px "VT323", "Segoe UI", Arial, sans-serif;
            }
            #rotate .glyph {
                width: 68px;
                height: 108px;
                border: 3px solid #ffc857;
                border-radius: 12px;
                animation: tilt 1.8s ease-in-out infinite;
            }
            #rotate .title {
                font: 400 13px "Press Start 2P", "Trebuchet MS", Arial, sans-serif;
                color: #ffc857;
                line-height: 1.8;
            }
            #rotate .sub {
                font-size: 24px;
                color: rgba(244, 246, 251, 0.62);
            }
            @keyframes tilt {
                0%,
                45% {
                    transform: rotate(0deg);
                }
                70%,
                100% {
                    transform: rotate(-90deg);
                }
            }
            /* Only on a touch device: a portrait desktop window is the player's own choice, and
               the letterbox there is merely ugly rather than unplayable. */
            @media (orientation: portrait) {
                body.is-touch #rotate {
                    display: flex;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #rotate .glyph {
                    animation: none;
                    transform: rotate(-90deg);
                }
            }
            /* Ambient surround: a blurred, darkened copy of the scene on stage, painted behind the
               canvas so the letterbox on screens that aren't 16:9 continues the picture instead
               of showing bars. Sized to the viewport at low resolution; the blur hides the rest. */
            #ambient {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                z-index: 0;
                pointer-events: none;
            }
            #canvasWrapper {
                position: relative;
                z-index: 1;
            }
            canvas {
                border: none;
                border-radius: 14px;
                box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.08),
                    0 24px 80px rgba(0, 0, 0, 0.65);
                background-color: #000;
                display: block;
                width: 100%; /* CSS size; actual drawing buffer set in JS */
                height: auto;
                aspect-ratio: calc(var(--target-width) / var(--target-height));
            }
        </style>
    </head>
    <body>
        <canvas id="ambient"></canvas>
        <div id="canvasWrapper">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="rotate">
            <div class="glyph"></div>
            <div class="title">TURN YOUR PHONE</div>
            <div class="sub">Doggo needs the screen sideways.</div>
        </div>

        <!-- STANDALONE VERSION OF THE GAME -->

        <script type="module">
            // Entry point for the standalone game: size the canvas, then run levels 1 -> 2 -> 3 -> 4 -> 5
            // (or start partway through the chain -- see LEVELS / START_LEVEL below).
            import { DoggoNogoCore, DoggoNogoUI } from "./game.js"
            import { DoggoNogoEngine } from "./engine.js"
            import { DoggoNogoInput } from "./input.js"
            import { level1 } from "./levels/level1.js"
            import { level2 } from "./levels/level2.js"
            import { level3 } from "./levels/level3.js"
            import { level4 } from "./levels/level4.js"
            import { level5 } from "./levels/level5.js"
            import { level1Cutscene, level2Cutscene, level3Cutscene, level4Cutscene, level5Cutscene } from "./levels/cutscenes.js"

            // 16:9 design canvas (the aspect of nearly every screen). Other screen shapes get a
            // letterbox, filled by the ambient painter below rather than left as bars.
            const TARGET_W = 1920
            const TARGET_H = 1080
            const ASPECT = TARGET_W / TARGET_H
            const canvas = document.getElementById("gameCanvas")

            // Ambient surround (see the #ambient style rule). Repainted whenever the engine
            // announces a new scene image and on resize; cheap because it renders at a quarter
            // of the viewport resolution and lets the blur do the rest.
            const ambient = document.getElementById("ambient")
            const ambientCtx = ambient.getContext("2d")
            function paintAmbient() {
                const img = DoggoNogoUI.ambient.image
                const vw = document.documentElement.clientWidth || window.innerWidth
                const vh = document.documentElement.clientHeight || window.innerHeight
                const w = Math.max(1, Math.round(vw / 4))
                const h = Math.max(1, Math.round(vh / 4))
                if (ambient.width !== w || ambient.height !== h) {
                    ambient.width = w
                    ambient.height = h
                }
                ambientCtx.clearRect(0, 0, w, h)
                if (!img) return // the body gradient shows through
                ambientCtx.save()
                ambientCtx.filter = `blur(${Math.max(2, Math.round(h * 0.03))}px) brightness(0.55) saturate(1.15)`
                // Slightly oversized so the blur's soft edge never reveals the gradient behind it.
                DoggoNogoUI.fx.drawImageCover(ambientCtx, img, -w * 0.05, -h * 0.05, w * 1.1, h * 1.1)
                ambientCtx.restore()
                // Recede further toward the edges so the stage stays the brightest thing on screen.
                const vignette = ambientCtx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.7)
                vignette.addColorStop(0, "rgba(7,10,18,0.25)")
                vignette.addColorStop(1, "rgba(7,10,18,0.8)")
                ambientCtx.fillStyle = vignette
                ambientCtx.fillRect(0, 0, w, h)
            }
            DoggoNogoUI.ambient.onChange(paintAmbient)

            function sizeCanvas() {
                // `innerWidth`/`innerHeight` include the scrollbar, and the canvas carries a 1px
                // border on each side, so sizing off them leaves the page a couple of pixels
                // scrollable -- enough for an arrow key to slide the whole canvas and look like the
                // camera jolting. Measure the real client area and leave room for the border.
                const BORDER = 2
                const maxW = document.documentElement.clientWidth - BORDER
                const maxH = document.documentElement.clientHeight - BORDER
                // Fill the window (no 1920/1080 cap), preserving the design aspect ratio;
                // the ambient painter fills whatever the aspect leaves over.
                let w = maxW
                let h = Math.round(w / ASPECT)
                if (h > maxH) {
                    h = maxH
                    w = Math.round(h * ASPECT)
                }
                // Set drawing buffer (for crisp rendering)
                const dpr = window.devicePixelRatio || 1
                canvas.width = Math.round(w * dpr)
                canvas.height = Math.round(h * dpr)
                // Set CSS size
                canvas.style.width = w + "px"
                canvas.style.height = h + "px"
                const ctx = canvas.getContext("2d")
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
            }

            // Arms the touch path: the rotate prompt only ever shows on a touch device (see the
            // `#rotate` rules), and taps are swallowed while it is up so a participant cannot
            // answer a trial they cannot see.
            document.body.classList.toggle("is-touch", DoggoNogoInput.isTouch)
            function syncOrientation() {
                const portrait = window.innerHeight > window.innerWidth
                DoggoNogoInput.suspended = DoggoNogoInput.isTouch && portrait
            }

            sizeCanvas()
            paintAmbient()
            syncOrientation()
            window.addEventListener("resize", () => {
                sizeCanvas()
                paintAmbient()
                syncOrientation()
                // Let current running level recompute sprite sizes/positions (engine also listens, but call directly for immediate effect)
                if (DoggoNogoEngine.level && typeof DoggoNogoEngine.level.handleResize === "function") {
                    DoggoNogoEngine.level.handleResize()
                }
            })

            // Every level the game knows about, in story order. What actually runs is `LEVELS`
            // below, which is this list or a subset of it.
            //
            // `number` is the level's own 1-based number, taken from its position here. It is kept
            // on the entry because only the illusion levels carry a `levelNumber` of their own, and
            // because once `?levels=` can drop levels, a level's position in the chain is no longer
            // its number.
            const ALL_LEVELS = [
                { level: level1, cutscene: level1Cutscene },
                { level: level2, cutscene: level2Cutscene },
                { level: level3, cutscene: level3Cutscene },
                { level: level4, cutscene: level4Cutscene },
                { level: level5, cutscene: level5Cutscene },
            ].map((entry, i) => ({ ...entry, number: i + 1 }))
            const START_LEVEL = 1 // 1-based; overridden by ?level=N

            /**
             * Which levels to run, from the URL. Two parameters, because "start here" and "run
             * exactly these" are different questions:
             *
             *   ?level=3     start at Level 3 and carry on to the end (3, 4, 5).
             *   ?levels=1-3  run ONLY Levels 1, 2 and 3, then finish. Also takes a comma-separated
             *                list and mixes the two: `?levels=1,3`, `?levels=1-2,5`.
             *
             * `levels` is the more specific of the two, so it wins and `level` is ignored when both
             * are given. Numbers outside 1..5 and unparseable entries are dropped with a warning
             * rather than failing the page; if nothing survives, the full chain runs.
             */
            function resolveChain() {
                const params = new URLSearchParams(window.location.search)
                const subset = params.get("levels")
                const start = params.get("level")

                if (subset !== null) {
                    if (start !== null) console.warn(`?levels=${subset} overrides ?level=${start}; running the listed levels.`)
                    const bad = []
                    const numbers = []
                    subset.split(",").forEach((part) => {
                        const piece = part.trim()
                        if (!piece) return
                        // A range ("1-3") or a single number ("4"). `to < from` counts down, so
                        // `?levels=3-1` is a deliberate reverse order rather than an empty chain.
                        const range = piece.match(/^(\d+)\s*-\s*(\d+)$/)
                        const wanted = range
                            ? (() => {
                                  const [from, to] = [parseInt(range[1], 10), parseInt(range[2], 10)]
                                  const step = from <= to ? 1 : -1
                                  return Array.from({ length: Math.abs(to - from) + 1 }, (_, i) => from + i * step)
                              })()
                            : /^\d+$/.test(piece)
                              ? [parseInt(piece, 10)]
                              : null
                        if (!wanted) return bad.push(piece)
                        wanted.forEach((n) => (n >= 1 && n <= ALL_LEVELS.length ? numbers.push(n) : bad.push(String(n))))
                    })
                    if (bad.length) console.warn(`?levels: ignoring "${bad.join('", "')}" (levels run from 1 to ${ALL_LEVELS.length}).`)
                    // Deduplicated, because running one level twice in a session would reuse its
                    // state object and log two runs under the same level number.
                    const picked = [...new Set(numbers)]
                    if (picked.length) {
                        console.warn(`?levels=${subset}: running level(s) ${picked.join(", ")} only.`)
                        return picked.map((n) => ALL_LEVELS[n - 1])
                    }
                    console.warn(`?levels=${subset}: nothing usable in it; running every level.`)
                    return ALL_LEVELS.slice()
                }

                const requested = parseInt(start === null ? START_LEVEL : start, 10)
                if (!Number.isFinite(requested) || requested < 1 || requested > ALL_LEVELS.length) {
                    console.warn(`Unknown start level "${start}"; starting at level 1.`)
                    return ALL_LEVELS.slice()
                }
                if (start === null) {
                    // Show the level actually being run in the address bar, so a reload or a copied
                    // link keeps it and it is obvious the game is not starting from the beginning.
                    params.set("level", requested)
                    window.history.replaceState(null, "", `${window.location.pathname}?${params}`)
                }
                return ALL_LEVELS.slice(requested - 1)
            }

            let LEVELS = resolveChain()
            // The chain always starts at its own first entry now that it is already the subset.
            const startIndex = 0

            // `?trials=N` shrinks every level to N trials: an ultra-short pass through the
            // chain, for testing and demos rather than data collection. `minTrialsPerPhase` has to
            // come down with it, because it is a floor under the phase target (see
            // `computePhaseTarget` in level1.js) -- a 3-trial level would otherwise still demand two
            // fast trials in each of its three phases. The parameter only ever *lowers* that floor,
            // so a long run keeps the level's own value.
            function applyTrialsOverride() {
                const requested = parseInt(new URLSearchParams(window.location.search).get("trials"), 10)
                if (!Number.isFinite(requested) || requested < 1) return
                LEVELS.forEach(({ level }) => {
                    level.params.trialsNumber = requested
                    level.params.minTrialsPerPhase = Math.min(level.params.minTrialsPerPhase, Math.max(1, Math.ceil(requested / 3)))
                })
                console.warn(`?trials=${requested}: short run, ${requested} trials per level. Not a session to collect data from.`)
            }
            applyTrialsOverride()

            /**
             * `?gamified=0` runs the barebones comparison condition: the same tasks with the same
             * timing, scoring and stimulus geometry, stripped of every gamified layer (see
             * game/plain/mode.js). REMOVABLE — this block and the `game/plain/` folder are the
             * whole feature. The import is dynamic, so a normal run never fetches the module.
             */
            let conditionOptions = {}
            if (/^(0|false|no)$/i.test(new URLSearchParams(window.location.search).get("gamified") ?? "")) {
                const { installPlainMode, plainEngineOptions } = await import("./plain/mode.js")
                LEVELS = installPlainMode(LEVELS)
                conditionOptions = plainEngineOptions
            }

            function runLevel(index) {
                const { level, cutscene, number } = LEVELS[index]
                const isLast = index === LEVELS.length - 1
                DoggoNogoEngine.run(canvas, level, {
                    assetBasePath: "assets/",
                    // Ask for browser fullscreen on the cover screen's SPACE press.
                    browserFullscreen: true,
                    cutscene,
                    // The cover belongs to the first level actually shown; chained ones go straight
                    // to their instruction screen.
                    skipCover: index !== startIndex,
                    // Only the levels still to come are worth preloading.
                    otherLevels: LEVELS.slice(index + 1).map((entry) => entry.level),
                    continueHint: isLast ? DoggoNogoUI.words.finishHint : DoggoNogoUI.words.continueHint,
                    onFinish: (state) => {
                        // The level's own number, not its position: with `?levels=` the chain is a
                        // subset and the two no longer agree.
                        if (isLast) console.log(`All levels finished. Final state level${number}:`, state)
                        // Same SPACE handoff either way - on to the next level, or to the end
                        // screen, which is what "Press SPACE to finish" on the last score screen
                        // now actually does.
                        const proceed = (e) => {
                            if (e.code === "Space") {
                                document.removeEventListener("keydown", proceed)
                                if (isLast) {
                                    // `renderEndScreen` stops the score screen's animation itself;
                                    // the engine has already cleared the ambient surround.
                                    DoggoNogoCore.renderEndScreen(canvas)
                                    // Nothing left to advance to, so nothing left for a tap to do
                                    // (the screen is deliberately terminal -- see game.js).
                                    DoggoNogoInput.setMode(null)
                                } else {
                                    runLevel(index + 1)
                                }
                            }
                        }
                        document.addEventListener("keydown", proceed)
                    },
                    // Empty in the normal run; the plain condition's screen overrides otherwise.
                    ...conditionOptions,
                })
            }

            ;(async () => {
                if (!canvas) {
                    console.error(`Could not start level ${LEVELS[startIndex].number}: canvas not found.`)
                    return
                }
                // The engine performs global + level preload internally; just call run after a slight defer for paint.
                DoggoNogoCore.renderLoadingScreen(canvas, "Loading the game...")
                setTimeout(() => runLevel(startIndex), 150)
            })()
        </script>
    </body>
</html>
